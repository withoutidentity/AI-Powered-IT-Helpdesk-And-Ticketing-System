<section class="auth-page">
  <div class="auth-panel wide">
    <div class="auth-copy">
      <p class="eyebrow">New account</p>
      <h2>Create Helpdesk Access</h2>
    </div>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form two-column">
      <label>
        Username
        <input type="text" formControlName="username" autocomplete="username" />
        @if (hasError('username')) {
          <span class="field-error">Username is required.</span>
        }
      </label>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (hasError('email')) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (hasError('password')) {
          <span class="field-error">Password must be at least 8 characters.</span>
        }
      </label>

      <label>
        Role
        <select formControlName="role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </label>

      <label class="full-width">
        Department
        <input type="text" formControlName="department" autocomplete="organization-title" />
        @if (hasError('department')) {
          <span class="field-error">Department is required.</span>
        }
      </label>

      <button class="full-width" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">Already have access? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
