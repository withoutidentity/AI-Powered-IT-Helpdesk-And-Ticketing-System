@if (auth.isAuthenticated()) {
  <main class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark">IT</span>
        <span>Helpdesk</span>
      </div>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Chat</a>
        <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/knowledge-base" routerLinkActive="active">Knowledge Base</a>
      </nav>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI-powered support</p>
          <h1>IT Helpdesk & Ticketing</h1>
        </div>

        @if (auth.currentUser(); as user) {
          <div class="user-menu">
            <span>{{ user.username }} · {{ user.role }}</span>
            <button type="button" class="secondary" (click)="logout()">Logout</button>
          </div>
        }
      </header>

      <router-outlet />
    </section>
  </main>
} @else {
  <main class="public-shell">
    <header class="public-brand">
      <span class="brand-mark">IT</span>
      <span>Helpdesk</span>
    </header>

    <router-outlet />
  </main>
}
